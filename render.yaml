# Render Blueprint for the StudyBuddy API.
# The client is deployed separately on Vercel and the database lives in MongoDB Atlas.
# Secrets marked with sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: studybuddy-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      - key: AI_DAILY_LIMIT
        value: 15
      - key: CLIENT_URL
        sync: false
